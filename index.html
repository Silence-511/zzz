<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>绝区零</title>
</head>

<body style="margin:0;background:black;text-align:center;color:white;">

<h1>ZZZ1</h1>

<video id="video"
       width="80%"
       autoplay
       muted
       playsinline>
  <source src="output.mp4" type="video/mp4">
</video>

<p id="unmuteHint" style="font-size:14px; color:gray;">点击页面任意位置开启声音</p>

<script>
var video = document.getElementById("video");

// 逻辑：用户只要点击页面任何地方，就尝试开启声音
document.body.onclick = function() {
    video.muted = false; 
    document.getElementById("unmuteHint").innerText = "音频已开启";
};

// 视频播放结束自动跳转
video.onended = function () {
    window.location.href = "https://zzz.mihoyo.com/cloud-feat/#/";
};
</script>

</body>
</html>
