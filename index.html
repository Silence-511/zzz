<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>绝区零</title>
</head>
<body style="margin:0;background:black;text-align:center;color:white;">

    <h1>ZZZ1</h1>

    <video id="video"
           width="80%"
           playsinline
           poster="cover.png" 
           style="cursor: pointer; display: block; margin: 0 auto; object-fit: cover;">
      <source src="output.mp4" type="video/mp4">
    </video>

    <br><br>

    <a id="jumpBtn"
       href="https://zzz.mihoyo.com/cloud-feat/#/"
       style="display: inline-block;
              color: white;
              font-size: 24px;
              text-decoration: none;
              border: 2px solid white;
              padding: 12px 30px;
              border-radius: 30px;
              transition: all 0.3s ease;
              background: transparent;">
       直接进入云·绝区零
    </a>

    <style>
        #jumpBtn:hover {
            background: white;
            color: black;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
    </style>

    <script>
    var video = document.getElementById("video");

    // --- 点击视频画面播放/暂停 ---
    video.onclick = function() {
        if (video.paused) {
            video.play(); // 如果暂停，就播放（此时封面会消失）
        } else {
            video.pause(); // 如果播放，就暂停
        }
    };

    // --- 视频播放结束自动跳转 ---
    video.onended = function () {
        window.location.href = "https://zzz.mihoyo.com/cloud-feat/#/";
    };
    </script>

</body>
</html>
